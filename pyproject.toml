[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rawxmp"
version = "0.1.0"
description = "Local, deterministic and explainable Canon CR2 -> Camera Raw XMP sidecar generator"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "opencv-python-headless>=4.8",
  "rawpy>=0.19",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
preview = ["matplotlib>=3.7"]
dev = ["pytest>=7", "matplotlib>=3.7"]

[project.scripts]
rawxmp = "rawxmp.cli.main:main"

[tool.setuptools.packages.find]
include = ["rawxmp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
